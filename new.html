<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <h1>Three equal width columns</h1>
   <div class="row">
    <div class="col-sm-1" style="background-color:pink;">.col</div>
    <div class="col-sm-1" style="background-color:blue;">.col</div>
    <div class="col-sm-1" style="background-color:orange;">.col</div>
    <div class="col-sm-1" style="background-color: violet;">.col</div>
    <div class="col-sm-1" style="background-color: green;">.col</div>
    <div class="col-sm-1" style="background-color: lightgoldenrodyellow;">.col</div>
    <div class="col-sm-1" style="background-color: black;">.col</div>
    <div class="col-sm-1" style="background-color: brown;">.col</div>
    <div class="col-sm-1" style="background-color:red;">.col</div>
    <div class="col-sm-1" style="background-color: lightpink;">.col</div>
    <div class="col-sm-1" style="background-color: lightgreen;">.col</div>
    <div class="col-sm-1" style="background-color: blue;">.col</div>
  </div>
  <div class="row">
    <div class="col-sm-2" style="background-color: green;">.col</div>
    <div class="col-sm-2" style="background-color: pink;">.col</div>
    <div class="col-sm-2" style="background-color: brown;">.col</div>
    <div class="col-sm-2" style="background-color: lightskyblue;">.col</div>
    <div class="col-sm-2" style="background-color: lightslategray;">.col</div>
    <div class="col-sm-2" style="background-color: brown;">.col</div>
  </div>
  <div class="row">
    <div class="col-sm-3" style="background-color: brown;">.col</div>
    <div class="col-sm-3" style="background-color: green;">.col</div>
    <div class="col-sm-3" style="background-color: blue;">.col</div>
    <div class="col-sm-3" style="background-color: blueviolet;">.col</div>
  </div>
  <div class="row">
    <div class="col-sm-4" style="background-color: violet;">.col</div>
    <div class="col-sm-4" style="background-color: brown;">.col</div>
    <div class="col-sm-4" style="background-color: black;">.col</div>

  </div>
  <div class="row">
    <div class="col-sm-6" style="background-color: pink;">.col</div>
    <div class="col-sm-6" style="background-color: brown;">.col</div>

  </div>
  <div class="row">
  <div class="col-sm-12" style="background-color: black;">.col</div>
</div>
</div>
</body>
</html>
