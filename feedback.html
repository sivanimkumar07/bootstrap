<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body class="container">
    <h1>Feedback form</h1>
    <div class="form-group">
        <label for="email">Name:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="form-group">
        <label for="pwd">Email:</label>
        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
    </div>
    <div class="form-group">
        <label for="comment">feedback:</label>
        <textarea class="form-control" rows="3" id="feedback"></textarea>
    </div>
    <div class="input-group mt-3 mb-3">
        <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-toggle="dropdown">
            Find wbsite
        </button>
        <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Website</a>
            <a class="dropdown-item" href="#">Facebook</a>
        </div>
    </div>
    <div class="form-check">
        <label class="form-check-label">
            <input type="radio" class="form-check-input " name="optradio">1 star
        </label>
    </div>
    <div class="form-check">
        <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">2 star
        </label>
    </div>

    <div class="form-check disabled">
        <label class="form-check-label">
            <input type="radio" class="form-check-input" name="optradio">3 star
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>

</body>

</html>
